# Default Layout: Speckit Target
# This file is the built-in routing and layout profile for the Speckit target.
# Copy and modify this file to create a per-target override (layoutOverridePath in steergen.config.yaml).
# See docs/routing-syntax.md for full syntax reference.

version: "1.0"

roots:
  globalRoot: "${globalRoot}"
  projectRoot: "${projectRoot}"
  targetRoot: "${generationRoot}/.specify/memory"

routes:
  # --- Global scope routes ---

  # Core anchor: global constitution (category=core, global scope)
  - id: core-global
    scope: global
    explicit: true
    anchor: core
    order: 10
    match:
      category: core
    destination:
      directory: "${targetRoot}"
      fileName: "constitution"
      extension: ".md"

  # Global category module: one file per category for non-core global rules
  - id: category-module-global
    scope: global
    explicit: false
    order: 20
    match:
      category: "*"
    destination:
      directory: "${targetRoot}"
      fileName: "${category}"
      extension: ".md"

  # --- Project scope routes ---

  # Core anchor: project constitution (category=core, project scope)
  - id: core-project
    scope: project
    explicit: true
    anchor: core
    order: 10
    match:
      category: core
    destination:
      directory: "${targetRoot}"
      fileName: "project-constitution"
      extension: ".md"

  # Project category module: one file per category for non-core project rules
  - id: category-module-project
    scope: project
    explicit: false
    order: 20
    match:
      category: "*"
    destination:
      directory: "${targetRoot}"
      fileName: "project-${category}"
      extension: ".md"

fallback:
  mode: other-at-core-anchor
  fileBaseName: other

purge:
  roots:
    - "${targetRoot}"
  globs:
    - "**/*.md"
