# Workspace-Local Layout Override — Acceptance Fixture
#
# Convention: layout YAML is stored alongside steergen.config.yaml in the project
# working directory. The `layoutOverridePath` in the config file uses a relative path.
#
# Example config linkage:
#   targets:
#     - id: speckit
#       enabled: true
#       layoutOverridePath: layouts/workspace-local-layout.yaml  # relative to config file
#
# This fixture routes category=core rules to constitution.md (global and project), routes
# known category-specific rules to category modules, and catches unknown categories via catch-all.
version: "1.0"

roots:
  globalRoot: "${globalRoot}"
  projectRoot: "${projectRoot}"
  targetRoot: "${projectRoot}/.speckit"

routes:
  - id: core-global
    scope: global
    explicit: true
    anchor: core
    order: 10
    match:
      category: core
    destination:
      directory: "${globalRoot}/.speckit"
      fileName: "constitution"
      extension: ".md"

  - id: security-global
    scope: global
    explicit: true
    order: 20
    match:
      category: security
    destination:
      directory: "${globalRoot}/.speckit"
      fileName: "security"
      extension: ".md"

  - id: catch-all-global
    scope: global
    explicit: false
    order: 100
    match:
      category: "*"
    destination:
      directory: "${globalRoot}/.speckit"
      fileName: "${category}"
      extension: ".md"

  - id: core-project
    scope: project
    explicit: true
    anchor: core
    order: 10
    match:
      category: core
    destination:
      directory: "${projectRoot}/.speckit"
      fileName: "constitution"
      extension: ".md"

  - id: security-project
    scope: project
    explicit: true
    order: 20
    match:
      category: security
    destination:
      directory: "${projectRoot}/.speckit"
      fileName: "security"
      extension: ".md"

  - id: catch-all-project
    scope: project
    explicit: false
    order: 100
    match:
      category: "*"
    destination:
      directory: "${projectRoot}/.speckit/${category}"
      fileName: "${category}-rules"
      extension: ".md"

fallback:
  mode: other-at-core-anchor
  fileBaseName: other

purge:
  roots:
    - "${globalRoot}/.speckit"
    - "${projectRoot}/.speckit"
  globs:
    - "**/*.md"
